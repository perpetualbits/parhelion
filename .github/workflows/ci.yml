# Parhelion CI — the completion gate (`make test`) on every push and PR.
#
# Governing docs: `docs/parhelion_milestone_plan.md` M0 (CI runs build + tests),
# `CLAUDE.md` ("Test before declaring done" → `make test` = workspace tests +
# clippy -D warnings). This is the M0 skeleton: one job, one gate.
#
# SYSTEM PACKAGES: two, each with a reason.
#
# The original rule here was "no apt step, on purpose": per the Smithay spike
# (`docs/smithay_threading_spike.md` §1) the protocol layer uses the pure-Rust
# wayland-backend and needs no libwayland, and the harness uses only the
# pure-Rust `png` codec. That rule earned its exception at M1 T6.
#
# **`libxkbcommon`** — a stated dependency since M1 T6:
#
#   - `wl_keyboard` cannot be implemented without an xkb keymap — the protocol
#     requires the compositor to send one — and xkbcommon is the library that
#     compiles it. There is no pure-Rust equivalent in the ecosystem we depend on.
#   - It was in fact already being linked *implicitly*: Smithay depends on the
#     `xkbcommon` crate unconditionally, so every test binary has linked
#     `libxkbcommon.so.0` since the protocol layer landed. CI passed because
#     `ubuntu-latest` happens to ship the library — luck, not contract. Installing
#     it explicitly converts that luck into a stated requirement, which is the
#     actual change here.
#
# **`foot`** — the M1 acceptance test (T7) runs a *real third-party terminal*
# against the compositor headlessly and asserts the whole arc: it maps, it commits
# shm pixels, frame callbacks keep flowing, typed keys reach it, and its redraw is
# a small fraction of the output. That test is the milestone's acceptance
# criterion, so the terminal it needs is a build dependency of the claim. Without
# the package the test skips loudly rather than failing, which is exactly what a
# developer without foot should get — and exactly what CI must not.
#
# **`libseat`** — a stated dependency since M2 T1:
#
#   - The DRM/KMS backend runs under a libseat session, which is what lets the
#     compositor open a DRM device and survive VT switches without being root.
#     Smithay's `backend_session_libseat` links against the library, so the crate
#     does not *build* without the headers.
#   - CI **builds** `parhelion-backend-drm` and runs its unit tests (mode
#     selection, refresh arithmetic, stride handling — all pure functions over
#     plain data). It never opens a device, never takes DRM master, and never
#     touches a connector: there is no GPU and no seat on a CI runner, and a test
#     that pretended otherwise would be testing the mock.
#
# Everything else still holds: no libwayland, no GPU packages, no display server.
# The winit and DRM backends are *built* here but their hardware paths are never
# run — one needs a display, the other a TTY. What proves those works is the
# interactive checklist in `docs/plans/m2_t1_smoke_checklist.md` and Roland's
# eyes, and the session summaries say so item by item.
name: CI

on:
  push:
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: make test (build + tests + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The three system dependencies (see the header): xkbcommon for
      # wl_keyboard's keymap, foot for the M1 acceptance test, and libseat for
      # the DRM backend's session layer. The two `-dev` packages are needed
      # because their crates link at build time; `foot` is a runtime dependency
      # of one test.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libseat-dev foot

      # Stable toolchain with clippy — `make test` runs `cargo clippy` with
      # warnings denied, so the clippy component is required.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Cache the cargo registry and target dir keyed on the lockfiles.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # The one gate: workspace tests, then clippy -D warnings (the CI profile
      # where the workspace's warn-level lints become hard failures).
      - name: make test
        run: make test
